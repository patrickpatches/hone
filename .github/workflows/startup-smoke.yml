# Startup smoke — on-device boot check.
#
# Why this exists: build #156 compiled cleanly, passed the web preview, and
# still FROZE on the splash screen on a real device (a provider-ordering bug
# that web SQLite/splash never reproduced). CI built an APK it never launched.
#
# This workflow closes that gap: after every Android build it boots an API 26
# emulator (matches minSdkVersion 26), installs the APK, and runs the startup
# smoke flow (maestro/flows/01-kitchen-loads.yaml) which asserts the Kitchen
# home screen renders within 6s of cold launch. If the app hangs on the splash,
# this fails — loudly, on the commit — instead of shipping a frozen build.
#
# Scope is deliberately narrow (the boot check only) so it stays fast and
# non-flaky. The full Maestro suite remains Phase 2 (see maestro-e2e.yml).

name: Startup smoke (on-device boot check)

on:
  # Auto-run after each Android build completes.
  workflow_run:
    workflows: ["Tucker & Spice Android Build"]
    types: [completed]
  # Manual: pass the eas-build run id to pull its APK.
  workflow_dispatch:
    inputs:
      run_id:
        description: 'eas-build run id to pull the APK from'
        required: true

jobs:
  smoke:
    name: Boots to Kitchen on a real emulator
    runs-on: ubuntu-latest
    # Only run when the build succeeded (or when dispatched manually).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout (for the Maestro flow)
        uses: actions/checkout@v4

      - name: Download the build's APK artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
          name: tuckerspice-v.*
          name_is_regexp: true
          path: apk/

      - name: Locate APK
        id: apk
        run: |
          APK=$(find apk/ -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK found in artifact"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, run startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        # This action returns a flaky non-zero on its own emulator teardown even
        # when the test passes (background logcat / adb shutdown). The real pass/
        # fail is enforced by the next step from /tmp/maestro_exit — so don't let
        # this step's exit code decide the job.
        continue-on-error: true
        with:
          api-level: 26
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r "${{ steps.apk.outputs.path }}"
            adb logcat -c || true
            # Capture logcat LIVE in the background to a file on the runner. The
            # emulator-runner action does not surface this script's stdout after a
            # failing command, so inline dumping is lost — a background file that the
            # next (normal) step prints is the reliable path.
            adb logcat -v time > /tmp/logcat.txt 2>&1 &
            set +e
            maestro test maestro/flows/01-kitchen-loads.yaml
            echo $? > /tmp/maestro_exit
            # Best-effort stop of the background logcat.
            pkill -f "adb logcat" 2>/dev/null || true
            # Always succeed here so the action finishes and /tmp files persist; the
            # next step prints the log and enforces the real maestro result.
            exit 0

      - name: Show logcat and enforce smoke result
        if: always()
        run: |
          echo "============ APP / CRASH LINES ============"
          grep -aiE "tuckerspice|ReactNativeJS|ReactNative|hermes|AndroidRuntime|FATAL|Exception|SoLoader|UnsatisfiedLink|dlopen|Unable to load|No implementation|art_|libc|DEBUG :" /tmp/logcat.txt | tail -150 || true
          echo "============ FULL LOGCAT TAIL (250) ============"
          tail -250 /tmp/logcat.txt 2>/dev/null || echo "(no logcat captured)"
          echo "==============================================="
          RC=$(cat /tmp/maestro_exit 2>/dev/null || echo 1)
          echo "maestro exit code: $RC"
          [ "$RC" = "0" ] || { echo "::error::startup smoke failed — app did not reach Kitchen"; exit 1; }

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-smoke-logcat
          path: /tmp/logcat.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Maestro debug output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-startup-smoke-debug
          path: ~/.maestro/tests/**
          retention-days: 14
          if-no-files-found: ignore
