# One-shot helper: fetch bread-guide image candidates from Pexels' CDN.
#
# Why this exists: the Claude remote-execution sandbox can't reach image CDNs
# (network allowlist), but Actions runners can. This downloads a candidate pool
# to a throwaway branch (claude/bread-assets-tmp); the engineer pulls it, views
# every image, keeps the accurate ones as docs/prototypes/assets/bread/*, and
# deletes the rest + this temp branch. Safe to delete this workflow afterwards.

name: Fetch bread guide image candidates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download candidate pool
        run: |
          mkdir -p docs/prototypes/assets/bread-candidates
          cd docs/prototypes/assets/bread-candidates
          # slot prefix = what the image is a candidate for
          declare -A CANDS=(
            [shape-10009355]=10009355  [shape-5903446]=5903446  [shape-3218467]=3218467  [shape-6287246]=6287246
            [loaf-4267969]=4267969     [loaf-6605201]=6605201   [loaf-7541727]=7541727   [loaf-1571075]=1571075
            [loaf-6605211]=6605211     [loaf-10202998]=10202998
            [tort-7613562]=7613562     [tort-26967707]=26967707 [tort-5837188]=5837188
            [pita-6419753]=6419753     [pita-1618898]=1618898   [pita-6054114]=6054114   [pita-6275158]=6275158
          )
          ok=0; fail=0
          for name in "${!CANDS[@]}"; do
            id=${CANDS[$name]}
            url="https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=1200"
            if curl -fsSL --max-time 30 -o "${name}.jpg" "$url" && [ "$(stat -c%s "${name}.jpg")" -gt 10000 ]; then
              ok=$((ok+1)); echo "OK   ${name} ($(stat -c%s "${name}.jpg") bytes)"
            else
              fail=$((fail+1)); rm -f "${name}.jpg"; echo "FAIL ${name} (id ${id})"
            fi
          done
          echo "downloaded=${ok} failed=${fail}"
          [ "$ok" -gt 0 ] || exit 1

      - name: Push to temp branch
        run: |
          git config user.name "bread-asset-fetcher"
          git config user.email "actions@github.com"
          git checkout -b claude/bread-assets-tmp
          git add docs/prototypes/assets/bread-candidates
          git commit -m "chore(tmp): bread guide image candidate pool (engineer to triage, branch is disposable)"
          git push -f origin claude/bread-assets-tmp
