<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Bread Bench — Living Recipe · Tucker &amp; Spice</title>
<meta name="theme-color" content="#9C3F12">
<meta name="description" content="A living sourdough recipe — edit the spec, watch the formula and timeline recompute, and set the exact moment to start so it's ready when you want it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── The Bread Bench warm-paper palette (from the design) ───────────── */
  :root{
    --paper:#F4EBDA; --paper-hi:#FBF5E9; --paper-lo:#EADDC4;
    --ink:#26190B; --ink-2:#5C4A33; --ink-3:#8C7A60;
    --crust:#9C3F12; --crust-hi:#C2581F; --crust-soft:rgba(156,63,18,.10);
    --proof:#43684C; --water:#39657F; --butter:#E8B33C;
    --rule:rgba(38,25,11,.14); --rule-soft:rgba(38,25,11,.08);
    --disp:'Fraunces',Georgia,serif; --body:'Newsreader',Georgia,serif; --ui:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#D7CFC0;
    font-family:var(--ui);
    color:var(--ink);
    min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .scroll::-webkit-scrollbar{width:0;height:0}
  .scroll{scrollbar-width:none}
  button{font-family:inherit}

  /* The phone. Full-bleed on a real phone; framed on the warm desk on desktop. */
  .stage{width:100%;min-height:100vh;display:flex;align-items:flex-start;justify-content:center}
  .phone{
    position:relative;width:100%;max-width:430px;min-height:100vh;
    background:var(--paper);overflow:hidden;
  }
  @media (min-width:520px){
    body{align-items:center;padding:40px 16px}
    .stage{min-height:auto}
    .phone{
      width:404px;height:840px;min-height:0;
      border:1px solid rgba(38,25,11,.13);border-radius:40px;
      box-shadow:0 30px 70px rgba(38,25,11,.28);
    }
  }
  .screen{position:absolute;inset:0;height:100%;overflow-y:auto}

  /* status + masthead */
  .statusbar{display:flex;justify-content:space-between;align-items:center;
    padding:max(16px,env(safe-area-inset-top)) 24px 0;font-size:13px;font-weight:700;color:var(--ink-3)}
  .eyebrow{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--crust)}
  .title{font-family:var(--disp);font-weight:900;font-size:33px;letter-spacing:-.01em;color:var(--ink);margin:6px 0 0}
  .lede{font-family:var(--body);font-style:italic;font-size:14px;color:var(--ink-3);line-height:1.5}

  /* spec cards */
  .specgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 24px 14px}
  .spec{position:relative;text-align:left;padding:13px 15px;border-radius:16px;border:1.5px solid var(--rule);
    background:var(--paper-hi);cursor:pointer;min-height:68px;transition:transform .12s ease,border-color .14s,background .14s}
  .spec:active{transform:scale(.985)}
  .spec:hover{border-color:rgba(156,63,18,.4)}
  .spec.wide{grid-column:1 / -1;min-height:60px}
  .spec .k{display:block;font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
  .spec .v{display:block;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink);line-height:1.15;margin-top:4px;padding-right:14px}
  .spec .pencil{position:absolute;top:13px;right:13px;color:var(--crust)}

  /* stepper */
  .stepper{display:flex;align-items:center;justify-content:space-between;margin:6px 24px 14px;
    padding:12px 16px;background:var(--paper-hi);border:1.5px solid var(--rule);border-radius:14px}
  .stepper .lbl{font-family:var(--ui);font-weight:600;font-size:14px;color:var(--ink)}
  .round{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rule);background:var(--paper);
    font-size:20px;color:var(--ink);cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
  .round:disabled{opacity:.35;cursor:default}
  .count{font-family:var(--disp);font-weight:700;font-size:20px;min-width:18px;text-align:center;color:var(--ink)}

  /* live stat tiles */
  .stats{display:flex;gap:9px;margin:0 24px 16px}
  .stat{flex:1;border-radius:15px;padding:13px 6px;text-align:center;position:relative}
  .stat.dark{background:var(--ink)}
  .stat.light{background:var(--paper-hi);border:1.5px solid var(--rule)}
  .stat.ready{background:var(--paper-hi);border:1.5px solid var(--crust);cursor:pointer}
  .stat .big{font-family:var(--disp);font-weight:900;font-size:23px;line-height:1}
  .stat .cap{font-family:var(--ui);font-size:8.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-top:5px}

  /* panels (formula / timeline) */
  .panel{margin:0 24px 16px;background:var(--paper-hi);border:1.5px solid var(--rule);border-radius:18px;padding:15px 17px}
  .panel-h{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--crust);margin-bottom:10px}
  .panel-h .sub{color:var(--ink-3);font-weight:600;letter-spacing:0;text-transform:none}
  .massbar{display:flex;height:40px;border-radius:10px;overflow:hidden;margin-bottom:10px;border:1.5px solid var(--rule)}
  .massbar > div{display:flex;align-items:center;justify-content:center;font-family:var(--ui);font-size:10px;
    font-weight:700;white-space:nowrap;overflow:hidden;transition:flex .35s ease}
  table.formula{width:100%;border-collapse:collapse}
  table.formula td{padding:8px 2px;border-bottom:1px solid var(--rule-soft)}
  .fname{font-family:var(--body);font-size:14.5px;color:var(--ink)}
  .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
  .fg{font-family:var(--disp);font-weight:700;font-size:17px;text-align:right;white-space:nowrap;color:var(--ink)}
  .fpc{font-family:var(--ui);font-size:11px;text-align:right;color:var(--ink-3);width:44px}
  .foot{font-family:var(--body);font-style:italic;font-size:12.5px;color:var(--ink-3);margin:9px 0 0}

  /* timeline */
  .tl{border-left:2px solid var(--paper-lo);margin-left:4px}
  .tl-row{position:relative;padding:1px 8px 12px 18px;border-radius:0 8px 8px 0}
  .tl-dot{position:absolute;left:-7px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--paper-hi);box-sizing:border-box}
  .tl-when{font-family:var(--disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .tl-label{font-family:var(--body);font-size:13.5px;color:var(--ink-2);line-height:1.4}
  .tl-chip{display:inline-block;font-family:var(--ui);font-size:10px;font-weight:700;color:var(--water);
    background:rgba(57,101,127,.12);border-radius:999px;padding:1px 8px;margin-left:6px}

  /* primary CTA */
  .cta{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--crust);
    color:#FFF6EA;border:none;border-radius:16px;padding:16px 18px;cursor:pointer;text-align:left}
  .cta .lab{font-family:var(--ui);font-weight:700;font-size:16px}
  .cta .sub2{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:2px}

  /* bottom sheet */
  .scrim{position:absolute;inset:0;background:rgba(20,12,4,.4);animation:dim .2s ease;z-index:20}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:26px 26px 0 0;
    box-shadow:0 -12px 40px rgba(38,25,11,.3);padding:8px 22px calc(26px + env(safe-area-inset-bottom));
    z-index:21;animation:sheetUp .26s cubic-bezier(.22,1,.36,1);max-height:82%;overflow-y:auto}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:8px auto 14px;cursor:pointer}
  .sheet-h{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
  .opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:15px;cursor:pointer;
    transition:border-color .14s,background .14s;margin-bottom:9px}
  .opt .on-row{display:flex;align-items:center;justify-content:space-between}
  .opt .nm{font-family:var(--ui);font-weight:700;font-size:15.5px}
  .opt .tag{display:block;font-family:var(--body);font-style:italic;font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
  .opt .tick{color:var(--crust);font-weight:800}
  .note{margin:12px 0 2px;padding:12px 14px;background:var(--paper-hi);border:1px solid var(--rule);
    border-left:2.5px solid var(--butter);border-radius:0 12px 12px 0;font-family:var(--body);font-style:italic;
    font-size:14px;line-height:1.5;color:var(--ink-2)}
  .note b{font-style:normal;color:var(--ink)}
  .tempval{display:flex;justify-content:flex-end;margin-bottom:2px}
  .tempval span{font-family:var(--disp);font-weight:700;font-size:38px;color:var(--ink)}
  .tempval small{font-size:18px;color:var(--ink-3)}
  input[type=range]{width:100%;accent-color:#9C3F12;height:34px;cursor:pointer}
  .cue{font-family:var(--body);font-style:italic;font-size:14px;color:var(--ink-2);margin:4px 0 2px}
  .cue b{font-style:normal;color:var(--ink)}

  /* ready-time picker */
  .seg{display:flex;border:1.5px solid var(--rule);border-radius:14px;overflow:hidden;background:var(--paper-hi);margin-bottom:18px}
  .seg button{flex:1;padding:13px 6px;font-family:var(--ui);font-weight:700;font-size:14px;border:none;cursor:pointer}
  .mini-h{font-family:var(--ui);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
  .daychips{display:flex;gap:8px;margin-bottom:18px}
  .daychips button{flex:1;padding:11px 5px;border-radius:999px;font-family:var(--ui);font-weight:600;font-size:12.5px;cursor:pointer}
  .timecards{display:flex;gap:8px;margin-bottom:18px}
  .timecards button{flex:1;text-align:center;padding:12px 6px;border-radius:14px;cursor:pointer;transition:border-color .14s,background .14s}
  .timecards .nm{display:block;font-family:var(--ui);font-weight:700;font-size:13.5px}
  .timecards .sub{display:block;font-family:var(--ui);font-size:11px;color:var(--ink-3);margin-top:2px}
  .resultcard{background:var(--ink);border-radius:16px;padding:16px 18px;color:var(--paper-hi)}
  .resultcard .rk{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--butter);margin-bottom:8px}
  .resultcard .rb{font-family:var(--body);font-size:15.5px;line-height:1.5}
  .resultcard .rb b{color:#fff}
  .resultcard .rt{font-family:var(--ui);font-size:11px;color:rgba(245,239,232,.55);margin-top:8px}
  .donebtn{width:100%;margin-top:14px;background:var(--crust);color:#FFF6EA;border:none;border-radius:14px;
    padding:15px;font-family:var(--ui);font-weight:700;font-size:15.5px;cursor:pointer}

  @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes sheetUp{from{transform:translateY(102%)}to{transform:translateY(0)}}
  @keyframes dim{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
    .massbar > div{transition:none}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen scroll" id="screen"><!-- rendered --></div>
  </div>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   The Bread Bench — "The living spec" (concept 02)
   Recreated faithfully from the Claude Design board
   "Bread Bench - revolutionary.dc.html" as a standalone, framework-free page.
   The baking engine and timings are ported verbatim; sourdough timings are
   verified against Maurizio Leo's Beginner's Sourdough (The Perfect Loaf).
   ════════════════════════════════════════════════════════════════════════ */

const S = {
  flour:'bakers', gear:'dutch', fan:'no', temp:24, loaves:'1', sched:'overnight',
  sheet:null,                       // null | 'flour' | 'gear' | 'fan' | 'temp' | 'sched' | 'ready'
  ready:{ mode:'now', dayOffset:1, hour:7, min:0 },
};

/* ── static data (ported) ─────────────────────────────────────────────── */
const HYD = { bakers:75, plain:66, wholemeal:78, spelt:72 };
const NAMES = {
  flour:{ bakers:'Bakers flour', plain:'Plain flour', wholemeal:'⅓ wholemeal', spelt:'⅓ spelt' },
  gear:{ dutch:'Dutch oven', camp:'Camp oven', tray:'Tray + steam', tin:'Loaf tin' },
  fan:{ no:'Conventional', yes:'Fan-forced' },
  sched:{ overnight:'Overnight cold proof', sameday:'Same-day bake' },
};
const LABELS = { flour:'Choose your flour', gear:'Bake it in', fan:'Your oven', temp:'Kitchen temperature', sched:'Schedule' };

const flourOpts = [
  { v:'bakers',    name:'Bakers flour',  tag:'An open, glossy crumb and a bold ear — the benchmark.' },
  { v:'plain',     name:'Plain flour',   tag:'Tighter, tender crumb. Superb toast, a modest ear.' },
  { v:'wholemeal', name:'⅓ wholemeal', tag:'Deeper, nuttier flavour; ferments faster.' },
  { v:'spelt',     name:'⅓ spelt',  tag:'Silky, sweet and extensible — shape it lightly.' },
];
const gearOpts = [
  { v:'dutch', name:'Dutch oven',  tag:'The gold standard — trapped steam, then a huge spring.' },
  { v:'camp',  name:'Camp oven',   tag:'Over coals, the original Aussie way — smoky and characterful.' },
  { v:'tray',  name:'Tray + steam',tag:'No special pot — a tray plus a steam tray. Crisper crust.' },
  { v:'tin',   name:'Loaf tin',    tag:'Forgiving, ideal for sandwich bread — shaping slips vanish.' },
];
const schedOpts = [
  { v:'overnight', name:'Overnight cold proof', tag:'Deeper tang, easy scoring — mix today, bake before breakfast.' },
  { v:'sameday',   name:'Same-day bake',        tag:'Faster but less forgiving — milder flavour, tighter window.' },
];
const fanOpts = [ { v:'no', name:'Conventional' }, { v:'yes', name:'Fan-forced' } ];

const NOTES = {
  flour:{
    bakers:`<b>Bakers flour (11.5–13% protein)</b> — the loaf this guide was written around. Strong gluten carries 75% water: open crumb, big spring. Woolies and Coles both stock it; a local mill’s is better again.`,
    plain:`<b>Plain flour (~10%)</b> — completely workable. The bench drops your water to 66% to match its weaker gluten. Expect a slightly flatter loaf with a tighter, tender crumb — superb toast, modest Instagram. Handle the folds gently; it tears sooner.`,
    wholemeal:`<b>⅓ wholemeal</b> — bran drinks more water (78% now) and snips gluten strands, so you get an extra fold and a shorter bulk: wholemeal ferments fast. Nutty, darker, honest bread.`,
    spelt:`<b>⅓ spelt</b> — spelt’s gluten stretches beautifully then gives up without warning. You’re at 72% water; fold gently. Sweet, almost honeyed flavour.`,
  },
  gear:{
    dutch:`<b>Dutch oven</b> — the gold standard: the lid traps the loaf’s own steam for the spring, then comes off for colour. Any heavy lidded pot ≥ 4 L.`,
    camp:`<b>Camp oven over coals</b> — the original Australian dutch oven. Heat is honest but uneven: you’ll rotate it twice and shovel coals onto the lid. Thicker, smokier crust — a feature.`,
    tray:`<b>Tray + steam</b> — no special pot: a preheated upturned tray to bake on, a second tray on the oven floor for boiling water. Slightly smaller spring, thinner crisper crust.`,
    tin:`<b>Loaf tin</b> — the forgiving option and the right call for sandwich bread. The tin holds the shape, so shaping mistakes vanish. No banneton needed.`,
  },
  sched:{
    overnight:`The fridge is your best ingredient: 12–16 hours cold builds the tang and makes scoring easy. Mix in the afternoon, bake before breakfast.`,
    sameday:`Doable, less forgiving — a warm proof gives you a 30-minute window where the fridge gives you four hours. Milder flavour.`,
  },
};

/* ── fermentation maths (ported) ─────────────────────────────────────── */
const tempFactor = t => Math.pow(2, (24 - t) / 8);
const bulkHnum = (flour, temp) => { let h = 4 * tempFactor(temp); if (flour === 'wholemeal') h *= 0.8; return Math.min(9, Math.max(2.5, h)); };
const levHnum  = temp => Math.min(12, Math.max(3, 4 * tempFactor(temp)));
const hrs = h => h >= 1 ? (Math.round(h * 2) / 2) + ' h' : Math.round(h * 60) + ' min';

const fanNote = fan => fan === 'yes'
  ? `Every oven temperature in your steps is already converted for <b>fan-forced</b> — no mental arithmetic with floury hands.`
  : `Temps below are for a <b>conventional</b> oven. Got fan-forced? Flip this and every number converts itself.`;
const tempNote = (temp, flour) => {
  const b = hrs(bulkHnum(flour, temp)), l = hrs(levHnum(temp));
  if (temp <= 19) return `<b>${temp}°C is a cold kitchen</b> (hello, southern winter). Bulk stretches to ~${b} — park the dough in the oven with just the light on and claw most of it back.`;
  if (temp >= 29) return `<b>${temp}°C is a hot kitchen</b> (Brisbane in January). Bulk shrinks to ~${b} and the ripe/over line is thin — check every 30 minutes; mix with fridge-cold water.`;
  return `At ${temp}°C, bulk runs about <b>${b}</b> and the levain ripens in ~${l}. Every timing ahead is already adjusted.`;
};
const tempCueHtml = temp => {
  let c = 'var(--proof)', t = 'The sweet spot.', d = 'Predictable, forgiving fermentation.';
  if (temp <= 19) { c = 'var(--water)'; t = 'Cool bench.'; d = 'Patient dough — easy to read.'; }
  else if (temp >= 28) { c = 'var(--crust-hi)'; t = 'Hot bench.'; d = 'Fast fermentation — check early and often.'; }
  return `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:7px;vertical-align:middle"></span><b>${t}</b> ${d}`;
};

/* ── the plan engine (ported verbatim, incl. Perfect Loaf timings) ────── */
function buildPlan(sel) {
  const n = +sel.loaves, hyd = HYD[sel.flour];
  const flour = 500 * n, water = Math.round(flour * hyd / 100), salt = Math.round(flour * .02), lev = Math.round(flour * .2);
  const r5 = x => Math.round(x / 5) * 5;
  const comps = {
    bakers:[['Bakers flour', r5(flour), '100%']],
    plain:[['Plain flour', r5(flour), '100%']],
    wholemeal:[['Bakers flour', r5(flour * 2 / 3), '67%'], ['Wholemeal flour', r5(flour / 3), '33%']],
    spelt:[['Bakers flour', r5(flour * 2 / 3), '67%'], ['Spelt flour', r5(flour / 3), '33%']],
  }[sel.flour];
  const formulaRows = [
    ...comps.map(c => ({ name:c[0], g:c[1] + ' g', pc:c[2], sw:'var(--butter)' })),
    { name:'Water', g:r5(water) + ' g', pc:hyd + '%', sw:'var(--water)' },
    { name:'Fine salt', g:salt + ' g', pc:'2%', sw:'var(--ink)' },
    { name:'Ripe levain', g:lev + ' g', pc:'20%', sw:'var(--crust-hi)' },
  ];
  const segs = [['flour', flour, 'var(--butter)', '#5C4308'], ['water', water, 'var(--water)', '#FFF8EC'], ['levain', lev, 'var(--crust-hi)', '#FFF8EC'], ['salt', salt, 'var(--ink)', '#FFF8EC']];
  const total = segs.reduce((a, x) => a + x[1], 0);
  const massbar = segs.map(x => ({ label:x[0], g:x[1], bg:x[2], color:x[3], flex:Math.max(x[1] / total * 100, 3), show:(x[1] / total * 100) > 13 }));

  const bulkH = bulkHnum(sel.flour, sel.temp), levH = levHnum(sel.temp), warmH = Math.min(4, 2.5 * tempFactor(sel.temp));
  // Verified against The Perfect Loaf — Beginner's Sourdough (Maurizio Leo):
  //   levain 5–6 h · autolyse 1 h · bulk ~4 h w/ 3 fold-sets 30 min apart ·
  //   preshape 25 min · cold proof 16 h @ 3°C · bake 20 covered + 30 uncovered @ 230°C · cool 1–2 h.
  const raw = [
    [Math.round(levH * 60), `Build the levain — ${hrs(levH)} at 23–24°C`, false],
    [60, 'Autolyse — flour + water, 1 h rest', false],
    [10, 'Mix in levain and salt', false],
    [Math.round(bulkH * 60), `Bulk — 3 sets of folds, 30 min apart (~${hrs(bulkH)} at ${sel.temp}°C)`, false],
    [25, 'Divide, preshape, 25 min bench rest', false],
    [10, 'Shape, then 20 min on the counter', false],
    sel.sched === 'overnight' ? [960, 'Cold proof in the fridge — 16 h at 3°C', true] : [Math.round(warmH * 60), `Warm final proof (~${hrs(warmH)})`, false],
    [45, 'Preheat the pot — 230°C', false],
    [50 + (n > 1 ? 15 * (n - 1) : 0), 'Score & bake — 20 min covered, 30 uncovered', false],
    [90, 'Cool on the rack — 1–2 h before slicing', true],
  ];
  const fmt = d => d.toLocaleString('en-AU', { weekday:'short', hour:'numeric', minute:'2-digit' }).replace(',', '');
  const fmtShort = d => d.toLocaleString('en-AU', { hour:'numeric', minute:'2-digit' });
  const totMin = raw.reduce((a, i) => a + i[0], 0);
  const ready = sel.ready || { mode:'now' };
  const now = new Date();
  let startD, targetD, canMake = true;
  if (ready.mode === 'target') {
    targetD = new Date(now); targetD.setDate(targetD.getDate() + (ready.dayOffset ?? 1)); targetD.setHours(ready.hour ?? 7, ready.min ?? 0, 0, 0);
    const earliest = new Date(now.getTime() + totMin * 60000);
    if (targetD.getTime() < earliest.getTime()) { canMake = false; targetD = earliest; }
    startD = new Date(targetD.getTime() - totMin * 60000);
  } else { startD = new Date(now); targetD = new Date(now.getTime() + totMin * 60000); }
  let t = new Date(startD);
  const timeline = raw.map(it => {
    const when = fmt(t);
    const chip = it[0] >= 120 ? Math.round(it[0] / 60) + ' h' : '';
    t = new Date(t.getTime() + it[0] * 60000);
    return { when, label:it[1], sleep:it[2], durChip:chip, hasChip:!!chip,
      dotColor:it[2] ? 'var(--water)' : 'var(--crust)', whenColor:it[2] ? 'var(--water)' : 'var(--crust)',
      rowBg:it[2] ? 'rgba(57,101,127,.07)' : 'transparent' };
  });
  const totalTxt = totMin >= 120 ? '≈' + Math.round(totMin / 60) + ' h' : totMin + ' min';
  const foot = `~${r5((flour + water + salt + lev) / n)} g of dough per loaf · levain = ${Math.round(lev / 5)} g starter + ${Math.round(lev * 2 / 5)} g flour + ${Math.round(lev * 2 / 5)} g water.`;
  return {
    formulaRows, massbar, timeline,
    readyWhen:fmt(targetD), readyShort:fmtShort(targetD), startWhen:fmt(startD),
    canMake, totalTxt, hyd, foot, yieldTxt:'' + n, n, readyMode:ready.mode,
  };
}

/* ── helpers ──────────────────────────────────────────────────────────── */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pencilSVG = '<span class="pencil"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span>';
const optStyle = on => on
  ? 'border:1.5px solid var(--crust);background:var(--crust-soft)'
  : 'border:1.5px solid var(--rule);background:var(--paper-hi)';

/* ── render ───────────────────────────────────────────────────────────── */
function specCard(field, key, value, wide) {
  return `<button class="spec${wide ? ' wide' : ''}" onclick="BB.open('${field}')" aria-label="${esc(key)}: ${esc(value)}. Edit.">
    <span class="k">${key}</span><span class="v">${esc(value)}</span>${pencilSVG}</button>`;
}

function renderScreen() {
  const plan = buildPlan(S);
  const val = {
    flour: NAMES.flour[S.flour], gear: NAMES.gear[S.gear], fan: NAMES.fan[S.fan],
    temp: S.temp + '°C', sched: NAMES.sched[S.sched],
  };
  const loafWord = +S.loaves > 1 ? 'loaves' : 'loaf';
  const tlSub = S.ready.mode === 'target' ? 'works backwards' : 'from now';

  const massbar = plan.massbar.map(m =>
    `<div style="flex:${m.flex} 0 0;background:${m.bg};color:${m.color}">${m.show ? `<span>${m.label} ${m.g}g</span>` : ''}</div>`
  ).join('');

  const formula = plan.formulaRows.map(r =>
    `<tr><td class="fname"><span class="sw" style="background:${r.sw}"></span>${esc(r.name)}</td>
      <td class="fg">${esc(r.g)}</td><td class="fpc">${esc(r.pc)}</td></tr>`
  ).join('');

  const timeline = plan.timeline.map(it =>
    `<div class="tl-row" style="background:${it.rowBg}">
      <span class="tl-dot" style="border:3px solid ${it.dotColor}"></span>
      <div class="tl-when" style="color:${it.whenColor}">${esc(it.when)}</div>
      <div class="tl-label">${esc(it.label)}${it.hasChip ? `<span class="tl-chip">${esc(it.durChip)}</span>` : ''}</div>
    </div>`
  ).join('') +
    `<div class="tl-row" style="padding-left:18px">
      <span class="tl-dot" style="left:-8px;top:4px;width:13px;height:13px;background:var(--proof);border:3px solid var(--proof)"></span>
      <div class="tl-when" style="font-size:18px;color:var(--proof)">${esc(plan.readyWhen)}</div>
      <div class="tl-label"><b style="color:var(--ink)">Ready.</b></div>
    </div>`;

  const minusDisabled = +S.loaves <= 1 ? 'disabled' : '';
  const plusDisabled  = +S.loaves >= 4 ? 'disabled' : '';

  return `
    <div class="statusbar"><span>8:42</span><span style="letter-spacing:2px">●●●</span></div>
    <div style="padding:14px 24px 4px">
      <div class="eyebrow">Living recipe</div>
      <h1 class="title">Your sourdough.</h1>
    </div>
    <p class="lede" style="padding:8px 24px 8px;margin:0">Tap a card to change it — the formula &amp; timeline update instantly.</p>

    <div class="specgrid">
      ${specCard('flour', 'Flour type', val.flour, false)}
      ${specCard('gear',  'Bake in',    val.gear,  false)}
      ${specCard('fan',   'Oven type',  val.fan,   false)}
      ${specCard('temp',  'Kitchen temp', val.temp, false)}
      ${specCard('sched', 'Schedule',   val.sched, true)}
    </div>

    <div class="stepper">
      <span class="lbl">Making ${plan.yieldTxt} ${loafWord}</span>
      <div style="display:flex;align-items:center;gap:14px">
        <button class="round" ${minusDisabled} onclick="BB.step(-1)" aria-label="Fewer loaves">−</button>
        <span class="count">${plan.yieldTxt}</span>
        <button class="round" ${plusDisabled} onclick="BB.step(1)" aria-label="More loaves">+</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat dark"><div class="big" style="color:var(--paper-hi)">${esc(plan.totalTxt)}</div><div class="cap" style="color:rgba(245,239,232,.6)">start → finish</div></div>
      <div class="stat light"><div class="big" style="color:var(--crust)">${plan.hyd}%</div><div class="cap" style="color:var(--ink-3)">hydration</div></div>
      <button class="stat ready" onclick="BB.open('ready')" aria-label="Ready ${esc(plan.readyShort)}. Set a ready time.">
        <span style="position:absolute;top:8px;right:9px;color:var(--crust)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg></span>
        <div class="big" style="color:var(--crust)">${esc(plan.readyShort)}</div><div class="cap" style="color:var(--ink-3)">ready · tap</div>
      </button>
    </div>

    <div class="panel">
      <div class="panel-h">Formula <span class="sub">· recomputes live</span></div>
      <div class="massbar">${massbar}</div>
      <table class="formula">${formula}</table>
      <p class="foot">${esc(plan.foot)}</p>
    </div>

    <div class="panel">
      <div class="panel-h">Timeline <span class="sub">· ${tlSub}</span></div>
      <div class="tl">${timeline}</div>
    </div>

    <div style="padding:0 24px 24px">
      <button class="cta" onclick="BB.startBaking()">
        <span class="lab">Start baking<span class="sub2">Oven Mode — one step at a time</span></span>
        <span style="font-size:20px">→</span>
      </button>
    </div>

    ${S.sheet ? renderSheet(plan) : ''}
  `;
}

function renderSheet(plan) {
  const sf = S.sheet;
  let inner = '';
  let label = LABELS[sf] || '';

  if (sf === 'temp') {
    label = LABELS.temp;
    inner = `
      <div class="tempval"><span id="bb-temp-val">${S.temp}<small>°C</small></span></div>
      <input type="range" min="16" max="32" value="${S.temp}" oninput="BB.tempInput(this.value)" onchange="BB.tempChange(this.value)" aria-label="Kitchen temperature">
      <div class="cue" id="bb-temp-cue">${tempCueHtml(S.temp)}</div>
      <div class="note" id="bb-temp-note">${tempNote(S.temp, S.flour)}</div>`;
  } else if (sf === 'ready') {
    label = 'When do you want it ready?';
    const rd = S.ready;
    const seg = (name, v) => `<button onclick="BB.readyMode('${v}')" style="${rd.mode === v ? 'background:var(--ink);color:var(--paper-hi)' : 'background:transparent;color:var(--ink-2)'}">${name}</button>`;
    const day = (name, v) => { const on = rd.mode === 'target' && rd.dayOffset === v; return `<button onclick="BB.readyDay(${v})" style="${on ? 'background:var(--ink);color:var(--paper-hi);border:1.5px solid var(--ink)' : 'background:var(--paper-hi);color:var(--ink-2);border:1.5px solid var(--rule)'}">${name}</button>`; };
    const tm = (name, sub, h, m) => { const on = rd.mode === 'target' && rd.hour === h && rd.min === m; return `<button onclick="BB.readyTime(${h},${m})" style="${optStyle(on)}"><span class="nm" style="color:${on ? 'var(--crust)' : 'var(--ink)'}">${name}</span><span class="sub">${sub}</span></button>`; };
    const target = rd.mode === 'target' ? `
      <div class="mini-h">Which day</div>
      <div class="daychips">${day('Tomorrow', 1)}${day('In 2 days', 2)}${day('In 3 days', 3)}</div>
      <div class="mini-h">What time</div>
      <div class="timecards">${tm('Breakfast', '7:00am', 7, 0)}${tm('Lunch', '12:30pm', 12, 30)}${tm('Dinner', '6:30pm', 18, 30)}</div>` : '';
    const result = plan.canMake ? `
      <div class="rk">Your schedule</div>
      <div class="rb">Start the levain <b>${esc(plan.startWhen)}</b>, and it’s ready <b>${esc(plan.readyWhen)}</b>.</div>
      <div class="rt">${esc(plan.totalTxt)} start to finish — nearly all of it hands-off waiting.</div>` : `
      <div class="rk">Not quite enough time</div>
      <div class="rb">A proper sourdough needs <b>${esc(plan.totalTxt)}</b>. The earliest this loaf can be ready is <b>${esc(plan.readyWhen)}</b> — I’ve set that for you.</div>`;
    inner = `
      <div class="seg">${seg('Start now', 'now')}${seg('Ready by…', 'target')}</div>
      ${target}
      <div class="resultcard">${result}</div>
      <button class="donebtn" onclick="BB.close()">Done</button>`;
  } else {
    // list editor: flour | gear | fan | sched
    const opts = (sf === 'flour' ? flourOpts : sf === 'gear' ? gearOpts : sf === 'fan' ? fanOpts : schedOpts);
    inner = opts.map(o => {
      const on = S[sf] === o.v;
      const tag = o.tag || (sf === 'fan' ? (o.v === 'yes' ? 'Steps convert every temp for you.' : 'Temps shown for a conventional oven.') : '');
      return `<button class="opt" onclick="BB.pick('${sf}','${o.v}')" style="${optStyle(on)}">
        <span class="on-row"><span class="nm" style="color:${on ? 'var(--crust)' : 'var(--ink)'}">${esc(o.name)}</span>${on ? '<span class="tick">✓</span>' : ''}</span>
        ${tag ? `<span class="tag">${esc(tag)}</span>` : ''}
      </button>`;
    }).join('');
    const noteHtml = sf === 'flour' ? NOTES.flour[S.flour] : sf === 'gear' ? NOTES.gear[S.gear] : sf === 'fan' ? fanNote(S.fan) : NOTES.sched[S.sched];
    inner += `<div class="note">${noteHtml}</div>`;
  }

  return `
    <div class="scrim" onclick="BB.close()"></div>
    <div class="sheet scroll" role="dialog" aria-modal="true" aria-label="${esc(label)}">
      <div class="grab" onclick="BB.close()"></div>
      <div class="sheet-h">${esc(label)}</div>
      ${inner}
    </div>`;
}

/* ── controller ───────────────────────────────────────────────────────── */
const elScreen = document.getElementById('screen');
function render() {
  const top = elScreen.scrollTop;
  elScreen.innerHTML = renderScreen();
  elScreen.scrollTop = top;
}

const BB = {
  open(field) { S.sheet = field; render(); },
  close() { S.sheet = null; render(); },
  pick(field, val) { S[field] = (field === 'temp' ? +val : val); S.sheet = null; render(); },
  step(d) { const n = Math.min(4, Math.max(1, +S.loaves + d)); S.loaves = '' + n; render(); },
  // temp slider: live-patch the sheet while dragging (background is dimmed), full recompute on release
  tempInput(v) {
    S.temp = +v;
    const val = document.getElementById('bb-temp-val');
    const cue = document.getElementById('bb-temp-cue');
    const note = document.getElementById('bb-temp-note');
    if (val) val.innerHTML = S.temp + '<small>°C</small>';
    if (cue) cue.innerHTML = tempCueHtml(S.temp);
    if (note) note.innerHTML = tempNote(S.temp, S.flour);
  },
  tempChange(v) { S.temp = +v; render(); },
  readyMode(m) { S.ready.mode = m; render(); },
  readyDay(d) { S.ready.dayOffset = d; S.ready.mode = 'target'; render(); },
  readyTime(h, m) { S.ready.hour = h; S.ready.min = m; S.ready.mode = 'target'; render(); },
  startBaking() {
    // Oven Mode is the next surface in the full Bread Bench; out of scope for this screen.
    const btn = document.querySelector('.cta .lab');
    if (btn) { const old = btn.innerHTML; btn.innerHTML = 'Oven Mode — coming next'; setTimeout(() => { btn.innerHTML = old; }, 1400); }
  },
};
window.BB = BB;
render();
</script>
</body>
</html>
