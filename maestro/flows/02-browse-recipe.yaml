appId: com.patricknasr.tuckerspice
---
# Smoke: tapping a recipe opens the detail screen without crashing.
# Catches: the Rules-of-Hooks crash class (v7 Phase B, builds #129–#131).
# Hummus is always seeded and always visible in the Levantine filter.
- launchApp:
    clearState: false
- scrollUntilVisible:
    element:
      text: "Hummus from Scratch"
    direction: DOWN
    timeout: 10000
- tapOn: "Hummus from Scratch"
- assertVisible:
    text: "Start Cooking"
    timeout: 6000
- assertVisible:
    text: "Inspired by"
