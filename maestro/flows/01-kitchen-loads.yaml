appId: com.patricknasr.tuckerspice
---
# Smoke: Kitchen tab renders on cold launch.
# Catches: any startup crash, blank-screen regression, frozen splash, tab-bar missing.
#
# Timeout rationale — 25 000 ms:
#   On a real device, DB init (migrations + seed 16 recipes) completes in 1–3 s.
#   On a cold CI emulator (GitHub Actions x86_64) the same path takes 8–12 s due
#   to virtualised I/O.  6 s was too tight and caused false failures on first boot.
#
#   25 s is still well inside the "genuinely broken" window:
#   - DB error  → onError fires → DbErrorScreen shows instead of Kitchen → FAIL ✓
#   - DB hang   → 15 s watchdog fires → DbErrorScreen shows → FAIL ✓
#   - Old-style splash freeze (no error boundary) → nothing ever renders → FAIL ✓
#   Real cold CI boot (~10 s) → Kitchen renders → PASS ✓
- launchApp:
    clearState: false
- assertVisible:
    text: "Browse by cuisine"
    timeout: 25000
- assertVisible:
    text: "Kitchen"
