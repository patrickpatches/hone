appId: com.patricknasr.tuckerspice
---
# Smoke: Kitchen tab renders on cold launch.
# Catches: any startup crash, blank-screen regression, frozen splash, tab-bar missing.
#
# Timed wait — 25 000 ms via extendedWaitUntil (NOT assertVisible.timeout):
#   assertVisible does not accept a `timeout` property — the installed Maestro CLI
#   rejects it with "Unknown Property: timeout" and the whole flow errors before it
#   ever looks at the screen. extendedWaitUntil is Maestro's canonical timed-wait.
#
#   Why 25 s: on a real device DB init (migrations + seed 16 recipes) is 1–3 s; on a
#   cold CI emulator (GitHub Actions x86_64) it is 8–12 s over virtualised I/O. 25 s
#   is still well inside the "genuinely broken" window:
#   - DB error → onError → DbErrorScreen shows instead of Kitchen → FAIL ✓
#   - DB hang  → 15 s watchdog → DbErrorScreen shows → FAIL ✓
#   - Old-style splash freeze (no error boundary) → nothing renders → FAIL ✓
#   - Real cold CI boot (~10 s) → Kitchen renders → PASS ✓
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Browse by cuisine"
    timeout: 25000
- assertVisible: "Kitchen"
